[package]
name = "tansu2"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/*"]

[dependencies]
async-channel = "2.5"
async-executor = "1.13"
async-io = "2.6"
async-lock = "3.4"
async-net = "2.0"
fastrand = "2.4"
blake3 = "1.8"
blocking = "1.7"
ctrlc = { version = "3.4", features = ["termination"] }
event-listener = "5.4"
futures-io = "0.3"
futures-lite = { version = "2.6", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"] }
getrandom = "0.3"
graviola = "0.4"
http-body-util = "0.1"
hyper = { package = "laputa-hyper-futures-lite", git = "https://github.com/joshuarli/hyper-futures-lite", rev = "770427abdcafc516531dd275423ceee0c0b1fb2e", version = "=1.12.0-beta.0", default-features = false, features = ["server", "http1", "http2"] }
lz4_flex = "0.14"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["backup", "modern_sqlite"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
tansu-search = { path = "crates/tansu-search" }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
ts-rs = "12.0"
tansu-webauthn = { path = "crates/tansu-webauthn" }

[dev-dependencies]
hyper = { package = "laputa-hyper-futures-lite", git = "https://github.com/joshuarli/hyper-futures-lite", rev = "770427abdcafc516531dd275423ceee0c0b1fb2e", version = "=1.12.0-beta.0", default-features = false, features = ["client", "http2"] }
tempfile = "3.27"

[build-dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
notify = { version = "8.2", default-features = false }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[patch.crates-io]
laputa-h2-futures-lite = { git = "https://github.com/joshuarli/h2-futures-lite", rev = "32d106fca1249b731c4169dc8f9115f55abe995b" }

[[bin]]
name = "tansu2"
path = "src/main.rs"

[[bin]]
name = "gen-api-types"
path = "src/bin/gen-api-types.rs"

