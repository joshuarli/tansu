[package]
name = "tansu2"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/*"]

[dependencies]
fastrand = "2.4"
getrandom = "0.3"
http-body-util = "0.1"
hyper = { version = "1", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
lz4_flex = "0.14"
pulldown-cmark = { version = "0.13", default-features = false }
rusqlite = { version = "0.40", features = ["backup", "modern_sqlite"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tantivy = { version = "0.26", default-features = false, features = ["mmap", "lz4-compression"] }
tansu-search = { path = "crates/tansu-search" }
toml = { version = "1.1.2", default-features = false, features = ["parse", "serde"] }
ts-rs = "12.0"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util", "signal"] }
tansu-webauthn = { path = "crates/tansu-webauthn" }

[dev-dependencies]
tempfile = "3.27"

[build-dependencies]
serde_json = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
notify = { version = "8.2", default-features = false }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = true

[[bin]]
name = "tansu2"
path = "src/main.rs"

[[bin]]
name = "gen-api-types"
path = "src/bin/gen-api-types.rs"

