[package]
name = "tansu"
version = "0.1.0"
edition = "2024"

[workspace]
members = [".", "crates/*"]

[dependencies]
async-channel = { package = "laputa-async-channel", version = "0.3" }
async-executor = { package = "laputa-async-executor", version = "0.3" }
async-io = { package = "laputa-async-io", version = "0.3" }
async-lock = { package = "laputa-async-lock", version = "0.3" }
async-net = { package = "laputa-async-net", version = "0.3" }
fastrand = { package = "laputa-fastrand", version = "0.3" }
blake3 = "1.8"
blocking = { package = "laputa-blocking", version = "0.3" }
ctrlc = { version = "3.4", features = ["termination"] }
event-listener = { package = "laputa-event-listener", version = "0.3" }
futures-io = "0.3"
futures-lite = { package = "laputa-futures-lite", version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await", "std"] }
getrandom = "0.4"
http-body-util = "0.1"
hyper = { package = "laputa-hyper-futures-lite", version = "=1.12.0-beta.1", default-features = false, features = ["server", "http1", "http2"] }
lz4_flex = "0.14"
pulldown-cmark = { version = "0.13", default-features = false }
psl = "2.1.241"
rusqlite = { version = "0.41", features = ["backup", "modern_sqlite"] }
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
rustc-hash = "2"
stats-producer = { version = "0.1.1", registry = "mycrates" }
deser = { version = "0.10.2", features = ["derive"] }
deser-json = "0.10.2"
deser-value = "0.10.2"
tantivy = { version = "0.27", default-features = false, features = ["mmap", "lz4-compression"] }
tansu-search = { path = "crates/tansu-search" }
tansu-api-types = { path = "crates/tansu-api-types" }
tansu-note-core = { path = "crates/tansu-note-core" }
ts-rs = "12.0"
tansu-webauthn = { path = "crates/tansu-webauthn" }

[dev-dependencies]
hyper = { package = "laputa-hyper-futures-lite", version = "=1.12.0-beta.1", default-features = false, features = ["client", "http2"] }
tempfile = "3.27"

[build-dependencies]
deser-json = "0.10.2"
deser-value = "0.10.2"
rustc-hash = "2"

[target.'cfg(target_os = "macos")'.dependencies]
notify = { version = "8.2", default-features = false, features = ["macos_fsevent"] }

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
notify = { version = "8.2", default-features = false }

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
strip = false

[[bin]]
name = "tansu"
path = "src/main.rs"

