---
allowBuilds:
  esbuild: true
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
ignoredOptionalDependencies:
  - "@esbuild/linux-arm"
  - "*aix*"
  - "*android*"
  - "*freebsd*"
  - "*linux-arm-*"
  - "*linux-ia32*"
  - "*linux-loong64*"
  - "*linux-mips64el*"
  - "*linux-ppc64*"
  - "*linux-s390x*"
  - "*netbsd*"
  - "*openbsd*"
  - "*openharmony*"
  - "*riscv64*"
  - "*sunos*"
  - "*wasm32*"
  - "*win32*"
minimumReleaseAgeExclude:
  - "@oxlint/binding-darwin-arm64@1.88.0"
  - "@oxlint/binding-darwin-x64@1.88.0"
  - "@oxlint/binding-linux-arm64-musl@1.88.0"
  - "@oxlint/binding-linux-x64-musl@1.88.0"
  - oxlint@1.88.0
...
