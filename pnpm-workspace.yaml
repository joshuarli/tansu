---
allowBuilds:
  esbuild: true
supportedArchitectures:
  os:
    - darwin
    - linux
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
ignoredOptionalDependencies:
  - "@esbuild/linux-arm"
  - "*aix*"
  - "*android*"
  - "*freebsd*"
  - "*linux-arm-*"
  - "*linux-ia32*"
  - "*linux-loong64*"
  - "*linux-mips64el*"
  - "*linux-ppc64*"
  - "*linux-s390x*"
  - "*netbsd*"
  - "*openbsd*"
  - "*openharmony*"
  - "*riscv64*"
  - "*sunos*"
  - "*wasm32*"
  - "*win32*"
minimumReleaseAgeExclude:
  - "@oxlint-tsgolint/darwin-arm64@7.0.2005"
  - "@oxlint-tsgolint/darwin-x64@7.0.2005"
  - "@oxlint-tsgolint/linux-arm64@7.0.2005"
  - "@oxlint-tsgolint/linux-x64@7.0.2005"
  - effect@4.0.6
  - oxlint-tsgolint@7.0.2005
...
