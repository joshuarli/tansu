version: 1

workflow:
  name: check
  timeout: 1h

on:
  manual: {}

runner:
  platform: linux/amd64

runtime:
  world: .niceforge/.smolworld
  runner-machine: runner
  workspace: /workspace

jobs:
  check:
    target:
      platform: linux/amd64
    timeout: 55m
    steps:
      - id: checkout
        name: Check out the sealed commit
        uses: niceforge/checkout
      - id: toolchain
        name: Install pnpm, the pinned Rust nightly and static SQLite
        shell: bash
        timeout: 15m
        run: |
          set -euo pipefail
          test "$(node --version)" = "v$(cat .node-version)"
          npm install --global --no-fund --no-audit "pnpm@$(node -p "require('./package.json').packageManager.split('@')[1]")"
          curl -fsSL -o /tmp/rustup-init https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
          echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path --profile minimal --default-toolchain none
          "$HOME/.cargo/bin/rustup" show active-toolchain
          "$HOME/.cargo/bin/rustup" target add x86_64-unknown-linux-musl
          apt-get -o Acquire::Retries=5 update -qq
          apt-get -o Acquire::Retries=5 install -y -qq --no-install-recommends musl musl-dev
          llvm=clang+llvm-23.1.5-x86_64-linux-musl
          curl -fsSL -o "/tmp/$llvm.tar.xz" "https://github.com/laputa-systems/llvm-prebuilt-musl/releases/download/llvm-musl-23.1.5-c4f9b08/$llvm.tar.xz"
          echo "8039dfa9e5b2ee53b04c1dcf94d65bd76c27842b0d4128c5a7bc6ba21d345fec  /tmp/$llvm.tar.xz" | sha256sum -c -
          tar -xf "/tmp/$llvm.tar.xz" -C /opt
          rm "/tmp/$llvm.tar.xz"
          mkdir -p /opt/musl/x86_64/usr
          ln -s /usr/include/x86_64-linux-musl /opt/musl/x86_64/usr/include
          printf '#!/bin/sh\nexec /opt/%s/bin/clang --target=x86_64-linux-musl --sysroot=/opt/musl/x86_64 "$@"\n' "$llvm" > /usr/local/bin/tansu-clang
          chmod 0755 /usr/local/bin/tansu-clang
          mkdir -p .work/tmp
          CC=tansu-clang AR="/opt/$llvm/bin/llvm-ar" TMPDIR="$PWD/.work/tmp" sh scripts/build-sqlite-static.sh /opt/tansu-sqlite
      - id: install
        name: Install the locked packages
        shell: bash
        timeout: 10m
        run: TMPDIR="$PWD/.work/tmp" pnpm install --frozen-lockfile
      - id: test-web
        name: Lint and test the web code
        shell: bash
        timeout: 10m
        run: |
          set -euo pipefail
          export TMPDIR="$PWD/.work/tmp"
          pnpm run lint
          pnpm run test
      - id: test-rust
        name: Run the Rust workspace tests
        shell: bash
        timeout: 30m
        run: |
          set -euo pipefail
          export PATH="$HOME/.cargo/bin:$PATH" TMPDIR="$PWD/.work/tmp"
          export SQLITE3_STATIC=1 SQLITE3_LIB_DIR=/opt/tansu-sqlite/lib SQLITE3_INCLUDE_DIR=/opt/tansu-sqlite/include LIBSQLITE3_SYS_USE_PKG_CONFIG=0
          export CARGO_PROFILE_DEV_DEBUG=0 CARGO_INCREMENTAL=0
          llvm=/opt/clang+llvm-23.1.5-x86_64-linux-musl
          export CC_x86_64_unknown_linux_musl="$llvm/bin/clang" AR_x86_64_unknown_linux_musl="$llvm/bin/llvm-ar"
          export CFLAGS_x86_64_unknown_linux_musl="--target=x86_64-linux-musl --sysroot=/opt/musl/x86_64"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER="$llvm/bin/clang"
          export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS="-Clink-arg=--target=x86_64-linux-musl -Clink-arg=--sysroot=/opt/musl/x86_64"
          pnpm run build:dev
          cargo test --locked --workspace --target x86_64-unknown-linux-musl
