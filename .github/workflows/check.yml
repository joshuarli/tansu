name: check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.work/tmp/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target
      DEFUDDLE_RS_DIR: ${{ github.workspace }}/.work/defuddle-rs
      PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.work/tmp/pnpm-store
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/tmp/playwright-browsers
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Create working directories
        run: mkdir -p .work/tmp
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          dest: ${{ github.workspace }}/.work/tmp/pnpm
          install: false
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          repository: joshuarli/defuddle-rs
          ref: master
          path: .work/defuddle-rs
          fetch-depth: 1

      - name: Install WASM optimizer
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends binaryen
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Install locked packages
        run: pnpm install --frozen-lockfile
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Check
        run: pnpm run check
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Rust tests
        run: pnpm run test:rs
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Install browser dependencies
        run: pnpm run playwright:install
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Chromium end-to-end tests
        run: pnpm run test:e2e:chromium
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: WebKit end-to-end tests
        run: pnpm run test:e2e:webkit
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Loupe browser tests
        run: pnpm run loupe:browser
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Loupe import end-to-end test
        run: pnpm run test:e2e:loupe
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
