name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/.work/tmp/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target
      DEFUDDLE_RS_DIR: ${{ github.workspace }}/.work/defuddle-rs
      PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.work/tmp/pnpm-store
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/tmp/playwright-browsers
      WASM_OPT: ${{ github.workspace }}/.work/tmp/binaryen/bin/wasm-opt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create working directories
        run: mkdir -p .work/tmp
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          dest: ${{ github.workspace }}/.work/tmp/pnpm
          install: false
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: joshuarli/defuddle-rs
          ref: master
          path: .work/defuddle-rs
          fetch-depth: 1

      - name: Install pinned Binaryen
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: |
          set -euo pipefail
          version=133
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            aarch64) arch=aarch64; sum=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="${{ github.workspace }}/.work/tmp/binaryen"
          mkdir -p "$dest"
          archive="$dest/binaryen.tar.gz"
          wget -O "$archive" "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-${arch}-linux.tar.gz"
          echo "$sum  $archive" | sha256sum -c -
          tar xf "$archive" -C "$dest" --strip-components=1
          test -x "$dest/bin/wasm-opt"

      - name: Install locked packages
        run: pnpm install --frozen-lockfile
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Check
        run: pnpm run check
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Rust tests
        run: pnpm run test:rs
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Install browser dependencies
        run: pnpm run playwright:install
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Chromium end-to-end tests
        run: pnpm run test:e2e:chromium
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: WebKit end-to-end tests
        run: pnpm run test:e2e:webkit
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Loupe browser tests
        run: pnpm run loupe:browser
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Loupe import end-to-end test
        run: pnpm run test:e2e:loupe
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
