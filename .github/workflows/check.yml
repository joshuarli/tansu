name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  check:
    runs-on: ubuntu-26.04-arm
    env:
      CARGO_HOME: ${{ github.workspace }}/.work/tmp/cargo-home
      CARGO_TARGET_DIR: ${{ github.workspace }}/.work/target
      DEFUDDLE_RS_DIR: ${{ github.workspace }}/.work/defuddle-rs
      PNPM_CONFIG_STORE_DIR: ${{ github.workspace }}/.work/tmp/pnpm-store
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.work/tmp/playwright-browsers
      TANSU_E2E_SERVER_BINARY: ${{ github.workspace }}/.work/tmp/cargo-target/x86_64-unknown-linux-musl/debug/tansu
      WASM_OPT: ${{ github.workspace }}/.work/tmp/binaryen/bin/wasm-opt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create working directories
        run: mkdir -p .work/tmp
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          dest: ${{ github.workspace }}/.work/tmp/pnpm
          install: false
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: joshuarli/defuddle-rs
          ref: master
          path: .work/defuddle-rs
          fetch-depth: 1

      - name: Install pinned Binaryen
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
        run: |
          set -euo pipefail
          version=133
          case "$(uname -m)" in
            x86_64) arch=x86_64; sum=2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489 ;;
            aarch64) arch=aarch64; sum=89c07ea56faf38d0fbecf36ca8ec0721756716185f265b568e133d427f299bf8 ;;
            *) echo "unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          dest="${{ github.workspace }}/.work/tmp/binaryen"
          mkdir -p "$dest"
          archive="$dest/binaryen.tar.gz"
          wget -O "$archive" "https://github.com/WebAssembly/binaryen/releases/download/version_${version}/binaryen-version_${version}-${arch}-linux.tar.gz"
          echo "$sum  $archive" | sha256sum -c -
          tar xf "$archive" -C "$dest" --strip-components=1
          test -x "$dest/bin/wasm-opt"

      - name: Install locked packages
        run: pnpm install --frozen-lockfile
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Check web
        run: pnpm run check:web
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Build Rust check image
        run: docker build --platform linux/amd64 -f docker/rust-check.Dockerfile -t tansu-rust-check .

      - name: Rust check and tests
        run: |
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" \
            -v "$PWD/.work/tmp/cargo-target:/target" \
            -e CARGO_TARGET_DIR=/target \
            -w /work \
            tansu-rust-check \
            sh -c 'cargo check --locked --workspace --target x86_64-unknown-linux-musl \
              && cargo test --locked --workspace --target x86_64-unknown-linux-musl'

      - name: Install browser dependencies
        run: pnpm run playwright:install
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Build e2e server binary
        run: |
          pnpm run build:dev
          docker run --rm --platform linux/amd64 \
            -v "$PWD:/work" \
            -v "$PWD/.work/tmp/cargo-target:/target" \
            -e CARGO_TARGET_DIR=/target \
            -w /work \
            tansu-rust-check \
            cargo build --locked --bin tansu --target x86_64-unknown-linux-musl

      - name: Build e2e image
        run: |
          docker build --platform linux/amd64 \
            --build-arg NODE_VERSION="$(cat .node-version)" \
            --build-arg PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")" \
            -f docker/linux-e2e-baselines.Dockerfile \
            -t tansu-linux-e2e-baselines .

      - name: Chromium end-to-end tests
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --ipc=host --shm-size=1g \
            -v "$PWD:/work" \
            -w /work \
            -e TANSU_E2E_SERVER_BINARY=/work/.work/tmp/cargo-target/x86_64-unknown-linux-musl/debug/tansu \
            -e TMPDIR=/work/.work/tmp \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            tansu-linux-e2e-baselines \
            pnpm run test:e2e:chromium

      - name: WebKit end-to-end tests
        run: |
          docker run --rm --platform linux/amd64 \
            --user "$(id -u):$(id -g)" \
            --ipc=host --shm-size=1g \
            -v "$PWD:/work" \
            -w /work \
            -e TANSU_E2E_SERVER_BINARY=/work/.work/tmp/cargo-target/x86_64-unknown-linux-musl/debug/tansu \
            -e TMPDIR=/work/.work/tmp \
            -e PLAYWRIGHT_BROWSERS_PATH=/ms-playwright \
            tansu-linux-e2e-baselines \
            pnpm run test:e2e:webkit

      - name: Loupe browser tests
        run: pnpm run loupe:browser
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp

      - name: Loupe import end-to-end test
        run: pnpm run test:e2e:loupe
        env:
          TMPDIR: ${{ github.workspace }}/.work/tmp
