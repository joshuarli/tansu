name: CI

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: Swatinem/rust-cache@v2.9.2

      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: 2.x

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: deno task playwright:install

      - name: Build embedded web assets
        run: deno task build

      - name: Validate
        run: make ci
