<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Set up Tansu</title>
    <link rel="stylesheet" href="/ts/setup.css" />
  </head>
  <body>
    <main>
      <h1>Set up Tansu</h1>
      <p>Add the Markdown folders you want Tansu to manage.</p>
      <form id="settings-form">
        <section id="vaults" aria-label="Vaults"></section>
        <button id="add-vault" type="button">Add vault</button>
        <details>
          <summary>Authentication</summary>
          <label>External origin <input name="externalOrigin" type="url" placeholder="https://notes.example.com" /></label>
          <label>Relying party ID <input name="rpId" autocomplete="off" placeholder="notes.example.com" /></label>
          <label>Relying party name <input name="rpName" autocomplete="off" placeholder="Tansu" /></label>
        </details>
        <button type="submit">Save settings</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/ts/setup.ts"></script>
  </body>
</html>
